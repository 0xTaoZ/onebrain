<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>连接 OpenTeams</title><style>{{CSS}}</style></head>
<body><main>
<div class="brand"><span class="mark" aria-hidden="true">O</span>OpenTeams</div>
<span class="eyebrow">手机与 iPad · 内网访问</span>
<h1>连接你的协作空间</h1>
<p class="intro">在同一内网，通过浏览器继续管理这台电脑上的团队与任务。</p>
<form method="post" action="/lan/login">
<label for="secret">配对码 <span>Pairing code</span></label>
<input id="secret" name="secret" type="password" required minlength="64" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="粘贴桌面端显示的配对码" autofocus>
<button type="submit">连接 / Connect</button>
</form>
<div class="note"><strong>首次连接</strong><p>在桌面端「设置 → 手机与 iPad 内网访问」复制配对码，并核对本机证书的 SHA-256 指纹。</p><p>配对码十分钟内有效且仅可使用一次。远程文件和命令在这台电脑上执行；会话最长八小时。退出后需在桌面端重新配对。</p></div>
<footer>仅限已配对设备 · HTTPS 加密连接</footer>
</main></body></html>
